<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">DACN 2026 — Student Early Warning System</title>
  <desc id="desc">Banner tối giới thiệu dự án cảnh báo sớm sinh viên với đồ họa dữ liệu học vụ.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1120" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1517"/>
      <stop offset="0.58" stop-color="#0E2222"/>
      <stop offset="1" stop-color="#10312E"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
